name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Type check
        run: npm run type-check

      - name: 🧹 EsLint
        run: npm run lint:fix

      - name: 👔 StyleLint
        run: npm run stylelint:css

      - name: 🎯 Format check
        run: npm run prettier:check

  build-storybook:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Build Storybook
        run: npm run build-storybook

      - name: 📤 Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Build library
        run: npm run build

      - name: 📤 Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 🧪 Unit tests
        run: npx vitest run --project=unit --project=snapshot-utils

      - name: ♿ A11y tests
        run: npm run test:storybook

      - name: 📸 Snapshot tests
        run: npm run test:storybook:snapshots

  deploy-storybook:
    needs: [lint, test, build-storybook]
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: 🚀 Deploy to GitHub Pages (Release)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: storybook-static
          destination_dir: .

      - name: 🚀 Deploy to GitHub Pages (Dev)
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: storybook-static
          destination_dir: dev
          keep_files: true

  publish-npm:
    needs: [lint, test, build-library]
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Upgrade npm
        run: corepack enable && corepack prepare npm@latest --activate

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download library artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 🔍 Check version changed (main only)
        if: github.ref == 'refs/heads/main'
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          PUBLISHED_VERSION=$(npm view neo-materia version 2>/dev/null || echo "0.0.0")
          echo "published_version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version changed from $PUBLISHED_VERSION to $CURRENT_VERSION"
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "❌ Version unchanged on main ($CURRENT_VERSION) — bump the version before merging to main"
            exit 1
          fi

      - name: 🚀 Publish to npm (stable)
        if: github.ref == 'refs/heads/main'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🚀 Publish to npm (dev)
        if: github.ref == 'refs/heads/develop'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${CURRENT_VERSION}-dev.$(git rev-parse --short HEAD)"
          npm version $DEV_VERSION --no-git-tag-version
          npm publish --tag dev --provenance

      - name: 🧹 Deprecate old dev versions
        if: github.ref == 'refs/heads/develop'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSIONS=$(node -e "
            const { execSync } = require('child_process');
            const currentVersion = require('./package.json').version;
            try {
              const all = JSON.parse(execSync('npm view neo-materia versions --json').toString());
              const devVersions = all.filter(v => v.startsWith(currentVersion + '-dev.'));
              console.log(devVersions.join('\n'));
            } catch(e) { process.exit(0); }
          ")
          while IFS= read -r version; do
            if [ -n "$version" ]; then
              echo "Deprecating neo-materia@$version"
              npm deprecate "neo-materia@$version" "Outdated dev build. Use neo-materia@dev for the latest development version."
            fi
          done <<< "$VERSIONS"
