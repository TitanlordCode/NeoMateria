name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: write
  pages: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Type check
        run: npm run type-check

      - name: 🧹 EsLint
        run: npm run lint:fix

      - name: 👔 StyleLint
        run: npm run stylelint:css

      - name: 🎯 Format check
        run: npm run prettier:check

  build-storybook:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Build Storybook
        run: npm run build-storybook

      - name: 📤 Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Build library
        run: npm run build

      - name: 📤 Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 🧪 Unit tests
        run: npx vitest run --project=unit --project=snapshot-utils

      - name: ♿ A11y tests
        run: npm run test:storybook

      - name: 📸 Snapshot tests
        run: npm run test:storybook:snapshots

  deploy-storybook:
    needs: [lint, test, build-storybook]
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: 🚀 Deploy to GitHub Pages (Release)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: storybook-static
          destination_dir: .

      - name: 🚀 Deploy to GitHub Pages (Dev)
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: storybook-static
          destination_dir: dev
          keep_files: true

  release:
    needs: [lint, test, build-library]
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Fetch all tags
        run: |
          git fetch --tags --force --prune-tags origin

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: 🧹 Deprecate old dev versions
        if: github.ref == 'refs/heads/develop'
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN
          VERSIONS=$(node -e "
            const { execSync } = require('child_process');
            try {
              const all = JSON.parse(execSync('npm view neo-materia versions --json').toString());
              const devVersions = all.filter(v => v.includes('-dev.'));
              console.log(devVersions.join('\n'));
            } catch(e) { process.exit(0); }
          ")
          while IFS= read -r version; do
            if [ -n "$version" ]; then
              echo "Deprecating neo-materia@$version"
              npm deprecate "neo-materia@$version" "Outdated dev build. Use neo-materia@dev for the latest development version."
            fi
          done <<< "$VERSIONS"
